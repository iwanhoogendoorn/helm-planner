# Push a tag that matches manifest.json's version (e.g. `git tag 1.0.1 && git push --tags`):
# tests run, the plugin is built, and a GitHub release with the three files BRAT needs is created.
name: Release
on:
  push:
    tags: ['*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the comment names the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'npm' }
      - name: Check the tag matches manifest.json, package.json, the lockfile and versions.json
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
