name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the comment names the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      # Fails on high or critical advisories in anything that ships (there are no runtime dependencies today).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
